<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in HTML</title>
</head>
<body>
    <ul>
        <h2>Fruits Name</h2>
        <li>Mongo</li>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Pears</li>
    </ul>
    <ol>
        <h2>Fruits Name</h2>
        <li>Mongo</li>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Pears</li>
    </ol>
</body>
</html>
