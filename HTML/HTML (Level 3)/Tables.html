<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLE in HTML</title>
</head>
<body>
    <table border="black">
        <caption>Food Menu</caption>
        <tr>
            <th>Item</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Frooti</td>
            <td>10₹</td>
        </tr>
        <tr>
            <td>Samosa</td>
            <td>20₹</td>
        </tr>
        <tr>
            <td>Chips</td>
            <td>5₹</td>
        </tr>
    </table>

    <!-- Colspan and Rowspan -->

    <table border="1">
        <caption>Food Menu</caption>
        <tr>
            <th rowspan="2">Item</th>
            <th colspan="2">Price</th>
        </tr>
        <tr>
            <th>INR</th>
            <th>USD</th>
        </tr>
        <tr>
            <td>Fruti</td>
            <td>10₹</td>
            <td>0.1$</td>
        </tr>
        <tr>
            <td>Samosa</td>
            <td>20₹</td>
            <td>0.5$</td>
        </tr>
        <tr>
            <td>Chips</td>
            <td>5₹</td>
            <td>0.1$</td>
        </tr>
    </table>
</body>
</html>
