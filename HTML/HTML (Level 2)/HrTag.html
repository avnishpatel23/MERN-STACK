<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hr Tag</title>
</head>
<body>
    <p>वर्षों तक वन में घूम-घूम,</p>
    <p>बाधा-विघ्नों को चूम-चूम,</p>
    <p>सह धूप-घाम, पानी-पत्थर,</p>
    <p>पांडव आये कुछ और निखर।</p>
    <p>सौभाग्य न सब दिन सोता है,</p>
    <p>देखें, आगे क्या होता है।</p>
    <hr>
    <p>मैत्री की राह बताने को,</p>
    <p>सबको सुमार्ग पर लाने को,</p>
    <p>दुर्योधन को समझाने को,</p>
    <p>भीषण विध्वंस बचाने को,</p>
    <p>भगवान् हस्तिनापुर आये,</p>
    <p>पांडव का संदेशा लाये।</p>
</body>
    
</html>
