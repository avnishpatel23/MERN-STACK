<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to include style</title>

    <!-- How to Link External Stylesheet -->
     <link rel="stylesheet" href="style.css">

     <!-- Using Style Tag -->
 <style>
    h2 
    {
        color: white;
        background-color: black;
    }
    
    h3 {
        color: blue;
        background-color: yellow;
    }
 </style>
 
</head>
<body>
   
    <!-- Using Style Tag -->
    <h2>Hello World!</h2>
    
    <!-- Inline Style -->
    <h1 style="color: red;">Apna College</h1>
    
    <p style="color: green;">This is Paragraph</p>
    
    <button style="background-color: aqua; color: white;">Submit</button>
    
    <h3> B.Tech </h3>
    <h3> Computer Science</h3>
</body>
</html>
